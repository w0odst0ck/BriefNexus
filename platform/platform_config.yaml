# BriefNexus 通用采集平台 — 平台配置(统一入口)
# 现有 intel/sources.yaml 保留向后兼容(CLI 继续可用),平台只认本文件。

server:
  host: 127.0.0.1
  port: 9000
  max_workers: 2            # 采集并发线程数(避免打爆反爬目标)
  task_timeout_s: 300       # 单任务超时,超时强制 failed(error=network)

# 代码内联(D16/D20): 是否允许 POST /v1/collect 的 collector.code 字段携带内联源码。
# 默认关闭;开启仅限本机/受信环境,平台在 exec 前做 AST 安全检查(黑名单导入与
# eval/exec/compile/open/__import__ 调用拦截)。
#   启动方式: ALLOW_INLINE_CODE=true python platform/run.py
#   (或写入 .env;生产环境不建议开启)
# ALLOW_INLINE_CODE: false

# 外部采集器目录(可选,可多个): 业务项目自维护的适配器目录,平台仓零改动。
# 启动时扫描目录下 *.py 并以 "_platform_ext_" 前缀模块名挂载(见 config.py)。
# 外部源通过 config.d 片段声明(见 config.d/README.md)。
collectors_extra_dirs:
#  - /path/to/external/collectors

# 内置源已退役(D17): 8 个 intel 源不再注册为平台内置源(intel/collectors/*.py
# 文件保留,作测试样例/参考实现)。平台升级为「纯执行框架」,源随请求传入:
#   - POST /v1/collect {"source": "xxx"}               → 查配置,查不到 422
#   - POST /v1/collect {"collector": {"module": "a.b:C"}} → 模块引用
#   - POST /v1/collect {"collector": {"code": "..."}}  → 代码内联(需开启开关)
# 需要源仍走平台时,用 config.d 片段声明(module 指向任何已安装模块)。
sources: {}

storage:
  db_path: data/briefnexus.db   # 相对项目根;WAL 模式,API 线程与 worker 并发写
  dedup_ttl_days: 90            # 去重键保留天数(预留,供后续清理任务使用)
  # consumed_ttl_days: 90       # 每日清理(D13): 已消费 items 保留天数,超期删除
  # task_archive_days: 30       # 每日清理(D13): 终态任务归档天数,超期归档(含其 items)
